<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Globy AI – Kết Nối thành công</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
            color: #20304a;
            background:
                radial-gradient(circle at 20% 0%, rgba(163, 210, 255, 0.35), transparent 55%),
                radial-gradient(circle at 80% 100%, rgba(255, 203, 228, 0.28), transparent 55%),
                linear-gradient(180deg, #f9fbff 0%, #eef4fc 100%);
        }

        .brand-header {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid rgba(126, 143, 170, 0.24);
            backdrop-filter: blur(14px) saturate(130%);
            -webkit-backdrop-filter: blur(14px) saturate(130%);
            box-shadow: 0 10px 24px rgba(74, 104, 148, 0.14);
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(145deg, #6ec0ff, #2f80ff);
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 8px 18px rgba(47, 128, 255, 0.3);
        }

        .brand-logo::after {
            content: "GT";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 18px;
            color: #fff;
        }

        .brand-title { font-size: 16px; font-weight: 700; white-space: nowrap; }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .checkmark-wrapper {
            position: relative;
            margin: 46px 0 30px;
            padding: 30px;
        }

        .checkmark-glow {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(54, 172, 110, 0.22), transparent 70%);
            filter: blur(18px);
            z-index: 0;
        }

        .checkmark {
            width: 146px;
            height: 146px;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 8px 20px rgba(54, 172, 110, 0.22));
            animation: pop-in 0.45s ease-out;
        }

        @keyframes pop-in {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke: #36ac6e;
            fill: none;
            animation: stroke-animation 0.55s ease-out forwards;
        }

        .checkmark__check {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke-width: 3;
            stroke: #36ac6e;
            fill: none;
            animation: check-animation 0.35s ease-out 0.55s forwards;
        }

        @keyframes stroke-animation { to { stroke-dashoffset: 0; } }
        @keyframes check-animation { to { stroke-dashoffset: 0; } }

        .message-box {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px) saturate(130%);
            -webkit-backdrop-filter: blur(14px) saturate(130%);
            border-radius: 22px;
            padding: 24px 28px;
            box-shadow:
                0 16px 30px rgba(74, 104, 148, 0.13),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(126, 143, 170, 0.24);
            max-width: 360px;
            width: 100%;
        }

        .message { font-size: 18px; font-weight: 600; }

        .count {
            font-weight: 800;
            color: #2f80ff;
            display: inline-block;
            animation: pulse 1s ease-out infinite;
        }

        @keyframes pulse { 50% { transform: scale(1.1); } }

        .hint {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .doc-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(47, 128, 255, 0.22);
            box-shadow: 0 8px 20px rgba(47, 128, 255, 0.14);
            text-decoration: none;
        }

        .doc-link span { font-size: 20px; }
        .doc-link strong { font-size: 14px; font-weight: 700; color: #2f80ff; }

        @media (max-width: 480px) {
            .checkmark { width: 120px; height: 120px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>

<div class="brand-header">
    <div class="brand-logo"></div>
    <div class="brand-title">Kết Nối Wifi Thành Công!</div>
</div>

<div class="container">

    <div class="checkmark-wrapper">
        <div class="checkmark-glow"></div>
        <svg class="checkmark" viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="23.5"/>
            <path class="checkmark__check" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
    </div>

    <div class="message-box">
        <div class="message">
            Thiết bị sẽ khởi động lại sau
            <span id="countdown" class="count">3</span> giây
        </div>

        <div class="hint">
            <a class="doc-link" href="https://ai.globy.tech/docs" target="_blank">
                <span>📘</span>
                <strong>Hướng dẫn sử dụng chi tiết</strong>
            </a>
        </div>
    </div>

</div>

<script>
window.addEventListener('load', function () {
    let count = 3;
    const el = document.getElementById('countdown');

    const timer = setInterval(() => {
        count--;
        el.textContent = count;

        if (count <= 0) {
            clearInterval(timer);
            fetch('/reboot', { method: 'POST' }).catch(()=>{});
        }
    }, 1000);
});
</script>

</body>
</html>
